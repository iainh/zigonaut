name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-windows
            runtime_arch: x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-windows
            runtime_arch: arm64

    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Fetch Zig dependencies
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            zig build --fetch -Dtarget=${{ matrix.target }}
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Run tests
        run: zig build test -Dtarget=${{ matrix.target }}

      - name: Install Windows App Runtime 2.3.1
        shell: pwsh
        env:
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-$env:RUNTIME_ARCH.exe"
          Invoke-WebRequest `
            -Uri "https://aka.ms/windowsappsdk/2.3/2.3.1/windowsappruntimeinstall-$env:RUNTIME_ARCH.exe" `
            -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Runtime installation failed with exit code $LASTEXITCODE."
          }

      - name: Build complete application
        run: zig build -Dtarget=${{ matrix.target }}
