name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and smoke-test (without a leading v)
        required: true
        type: string
      create_release:
        description: Create or update the draft release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.create_release && format('refs/tags/v{0}', inputs.version) || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Match tag and package versions
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:RELEASE_TAG -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Release tag '$env:RELEASE_TAG' must have the form v1.2.3 or v1.2.3-rc.1."
            }
            $version = $Matches.version
          } else {
            $version = $env:DISPATCH_VERSION
            if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
              throw "Version '$version' must have the form 1.2.3 or 1.2.3-rc.1."
            }
          }

          $msiVersion = [version]($version.Split('-')[0])
          if ($msiVersion.Major -gt 255 -or $msiVersion.Minor -gt 255 -or $msiVersion.Build -gt 65535) {
            throw "Version '$version' exceeds Windows Installer's 255.255.65535 version limits."
          }

          $zon = Get-Content build.zig.zon -Raw
          $zonMatch = [regex]::Match($zon, '(?m)^\s*\.version\s*=\s*"([^"]+)"')
          if (-not $zonMatch.Success -or $zonMatch.Groups[1].Value -ne $version) {
            throw "build.zig.zon version must be '$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

  prepare_release:
    name: Prepare draft GitHub release
    if: github.event_name == 'push' || inputs.create_release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reuse draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published." >&2
              exit 1
            fi
            exit 0
          fi

          args=(
            "$RELEASE_TAG"
            --verify-tag
            --draft
            --generate-notes
            --title "Zigonaut $VERSION"
          )
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

  build:
    name: Package Windows (${{ matrix.package_arch }})
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.prepare_release.result == 'success' || needs.prepare_release.result == 'skipped')
    needs: [validate, prepare_release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-windows-gnu
            runtime_arch: x64
            package_arch: x64
          - runner: windows-11-arm
            target: aarch64-windows-gnu
            runtime_arch: arm64
            package_arch: arm64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Install Zig 0.16.0
        shell: pwsh
        env:
          ZIG_X64_URL: https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
          ZIG_X64_SHA256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
        run: |
          # Use x64 on both runners because the Zig 0.16.0 ARM64 compiler crashes on Windows.
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.16.0.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.16.0'
          Invoke-WebRequest -Uri $env:ZIG_X64_URL -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $env:ZIG_X64_SHA256) {
            throw 'Zig x64 archive checksum mismatch.'
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          $sdk >> $env:GITHUB_PATH
          "ZIG_GLOBAL_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'zig-cache')" >> $env:GITHUB_ENV
          & (Join-Path $sdk 'zig.exe') version

      - name: Fetch Zig dependencies
        shell: pwsh
        run: |
          # Zig 0.16.0 does not create this directory before fetching a zip.
          New-Item -ItemType Directory -Force (Join-Path $env:ZIG_GLOBAL_CACHE_DIR 'tmp') | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            zig build --fetch -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Run tests
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Install Windows App Runtime 2.3.1
        shell: pwsh
        env:
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-$env:RUNTIME_ARCH.exe"
          Invoke-WebRequest `
            -Uri "https://aka.ms/windowsappsdk/2.3/2.3.1/windowsappruntimeinstall-$env:RUNTIME_ARCH.exe" `
            -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Runtime installation failed with exit code $LASTEXITCODE."
          }

      - name: Build complete release application
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Install WiX Toolset 7.0.0
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix --version

      - name: Create release packages and checksums
        id: package
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          $name = "zigonaut-v$env:VERSION-windows-$env:PACKAGE_ARCH"
          $staging = Join-Path $env:RUNNER_TEMP $name
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force $staging, $dist | Out-Null

          $releaseFiles = @(
            'zigonaut.exe',
            'Zigonaut.WinUI.Bridge.dll',
            'Microsoft.WindowsAppRuntime.Bootstrap.dll',
            'conpty.dll',
            'resources.pri',
            'zigonaut-about-1024.png'
          )
          foreach ($file in $releaseFiles) {
            $source = Join-Path $env:GITHUB_WORKSPACE "zig-out\bin\$file"
            if (-not (Test-Path $source -PathType Leaf)) {
              throw "Release build did not produce $file."
            }
            Copy-Item $source $staging
          }
          $conptyHost = Join-Path $env:GITHUB_WORKSPACE "zig-out\bin\$env:PACKAGE_ARCH\OpenConsole.exe"
          if (-not (Test-Path $conptyHost -PathType Leaf)) {
            throw "Release build did not produce $env:PACKAGE_ARCH\OpenConsole.exe."
          }
          Copy-Item (Split-Path $conptyHost -Parent) $staging -Recurse
          $themes = Join-Path $env:GITHUB_WORKSPACE 'zig-out\bin\themes'
          if (-not (Test-Path $themes -PathType Container)) {
            throw 'Release build did not produce the themes directory.'
          }
          Copy-Item $themes $staging -Recurse
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'README.md') $staging
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') $staging
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'licenses') $staging -Recurse

          # Future signing order: sign staged EXE/DLL payloads here, then sign
          # the MSI immediately after wix build and before its checksum.
          $archive = Join-Path $dist "$name.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash *$name.zip" | Set-Content -Encoding ascii "$archive.sha256"

          $msi = Join-Path $dist "$name.msi"
          $msiVersion = $env:VERSION.Split('-')[0]
          $upgradeCodes = @{
            x64 = '103430D3-6D2E-45D6-A865-FAED8BCE75A2'
            arm64 = '7CD97D0C-F6E2-468B-A863-2D34ED6E443A'
          }
          wix build installer\Package.wxs `
            -acceptEula wix7 `
            -arch $env:PACKAGE_ARCH `
            -d "Version=$msiVersion" `
            -d "StagingDir=$staging" `
            -d "UpgradeCode=$($upgradeCodes[$env:PACKAGE_ARCH])" `
            -out $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          "$hash *$name.msi" | Set-Content -Encoding ascii "$msi.sha256"

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT

      - name: Smoke-test packaged application
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'zigonaut-smoke-test'
          Expand-Archive -Path $env:ARCHIVE -DestinationPath $smoke
          $process = Start-Process `
            -FilePath (Join-Path $smoke 'zigonaut.exe') `
            -WorkingDirectory $smoke `
            -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Packaged Zigonaut exited during startup with code $($process.ExitCode)."
          }
          taskkill /PID $process.Id /T /F | Out-Null

      - name: Smoke-test MSI install and uninstall
        shell: pwsh
        env:
          MSI: ${{ steps.package.outputs.msi }}
        run: |
          $installLog = Join-Path $env:RUNNER_TEMP 'zigonaut-msi-install.log'
          $install = Start-Process msiexec.exe `
            -ArgumentList @('/i', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', "`"$installLog`"") `
            -Wait `
            -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content $installLog
            throw "MSI installation failed with exit code $($install.ExitCode)."
          }

          $installedExecutable = Join-Path $env:LOCALAPPDATA 'Spiralpoint\Zigonaut\zigonaut.exe'
          if (-not (Test-Path $installedExecutable -PathType Leaf)) {
            throw "MSI did not install $installedExecutable."
          }

          $uninstallLog = Join-Path $env:RUNNER_TEMP 'zigonaut-msi-uninstall.log'
          $uninstall = Start-Process msiexec.exe `
            -ArgumentList @('/x', "`"$env:MSI`"", '/qn', '/norestart', '/l*v', "`"$uninstallLog`"") `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            Get-Content $uninstallLog
            throw "MSI uninstallation failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path $installedExecutable) {
            throw "MSI uninstall left $installedExecutable behind."
          }

      - name: Upload tested package to draft release
        if: github.event_name == 'push' || inputs.create_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
