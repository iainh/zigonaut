name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-windows-gnu
            runtime_arch: x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-windows-gnu
            runtime_arch: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Install Zig 0.16.0
        shell: pwsh
        env:
          ZIG_X64_URL: https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
          ZIG_X64_SHA256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
        run: |
          # Use x64 on both runners because the Zig 0.16.0 ARM64 compiler crashes on Windows.
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.16.0.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.16.0'
          Invoke-WebRequest -Uri $env:ZIG_X64_URL -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $env:ZIG_X64_SHA256) {
            throw 'Zig x64 archive checksum mismatch.'
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          $sdk >> $env:GITHUB_PATH
          "ZIG_GLOBAL_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'zig-cache')" >> $env:GITHUB_ENV
          & (Join-Path $sdk 'zig.exe') version

      - name: Fetch Zig dependencies
        shell: pwsh
        run: |
          # Zig 0.16.0 does not create this directory before fetching a zip.
          New-Item -ItemType Directory -Force (Join-Path $env:ZIG_GLOBAL_CACHE_DIR 'tmp') | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            zig build --fetch -Dtarget=${{ matrix.target }}
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Run tests
        run: zig build test -Dtarget=${{ matrix.target }}

      - name: Install Windows App Runtime 2.3.1
        shell: pwsh
        env:
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-$env:RUNTIME_ARCH.exe"
          Invoke-WebRequest `
            -Uri "https://aka.ms/windowsappsdk/2.3/2.3.1/windowsappruntimeinstall-$env:RUNTIME_ARCH.exe" `
            -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Runtime installation failed with exit code $LASTEXITCODE."
          }

      - name: Build complete application
        run: zig build -Dtarget=${{ matrix.target }}
