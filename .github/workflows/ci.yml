name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Linux GTK (Debian 13, x86_64)
    runs-on: ubuntu-24.04
    container: debian:13

    steps:
      - name: Install GTK and UI test dependencies
        run: apt-get update && apt-get install -y ca-certificates curl git xz-utils libgtk-4-dev libadwaita-1-dev libpng-dev pkg-config xvfb xauth xdotool xclip python3-pil python3-pyatspi dbus-x11 imagemagick fonts-dejavu-core

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Zig 0.17.0
        env:
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          archive="$RUNNER_TEMP/zig-x86_64-linux-0.17.0.tar.xz"
          sdk="$RUNNER_TEMP/zig-x86_64-linux-0.17.0"
          curl --fail --location --retry 3 "$ZIG_URL" --output "$archive"
          echo "$ZIG_SHA256  $archive" | sha256sum --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$sdk" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"

      - name: Fetch Zig dependencies
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          for attempt in 1 2 3; do
            zig build --fetch && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((10 * attempt))
          done

      - name: Run required checks and install application
        run: zig build ci && zig build

      - name: Test GTK sessions and input
        run: xvfb-run -a zig build test-linux-ui

      - name: Test Kitty presentation at native 2x
        run: xvfb-run -a -s '-screen 0 2200x1500x24' zig build test-linux-images-ui

      - name: Test native pointer reporting and links at 2x
        run: xvfb-run -a -s '-screen 0 2400x1800x24' env GDK_SCALE=2 zig build test-linux-pointer-ui

  macos:
    name: macOS (arm64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Zig 0.17.0
        env:
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz
          ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
        run: |
          archive="$RUNNER_TEMP/zig-aarch64-macos-0.17.0.tar.xz"
          sdk="$RUNNER_TEMP/zig-aarch64-macos-0.17.0"
          curl --fail --location --retry 3 "$ZIG_URL" --output "$archive"
          echo "$ZIG_SHA256  $archive" | shasum --algorithm 256 --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          rm -f "$archive"
          echo "$sdk" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
          "$sdk/zig" version

      - name: Fetch Zig dependencies
        run: |
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          for attempt in 1 2 3; do
            zig build --fetch -Dtarget=aarch64-macos && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((10 * attempt))
          done

      - name: Install additional test shells
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install bash fish

      - name: Run required checks
        run: zig build ci -Dtarget=aarch64-macos

      - name: Test Bash and fish integration
        run: |
          prefix="$(brew --prefix)"
          python3 assets/shell-integration/test_additional_shells.py \
            zig-out/bin/zigonaut-pty-helper "$prefix/bin/bash" "$prefix/bin/fish"

      - name: Build complete application bundle
        run: zig build macos-app -Dtarget=aarch64-macos

      - name: Validate application bundle
        run: |
          test -x zig-out/Zigonaut.app/Contents/MacOS/ZigonautMac
          test -x zig-out/Zigonaut.app/Contents/MacOS/zigonaut-pty-helper
          test -f zig-out/Zigonaut.app/Contents/Frameworks/libzigonaut-core.dylib
          test -f zig-out/Zigonaut.app/Contents/Resources/ShellIntegration/zsh/.zshenv
          test -f zig-out/Zigonaut.app/Contents/Resources/ShellIntegration/bash/zigonaut.bash
          test -f zig-out/Zigonaut.app/Contents/Resources/ShellIntegration/fish/zigonaut.fish
          plutil -lint zig-out/Zigonaut.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 zig-out/Zigonaut.app

      - name: Remove build caches
        if: always()
        run: |
          rm -rf "$ZIG_GLOBAL_CACHE_DIR" .zig-cache macos/.build

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-windows-gnu
            runtime_arch: x64

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Zig 0.17.0
        shell: pwsh
        env:
          ZIG_X64_URL: https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip
          ZIG_X64_SHA256: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.17.0.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.17.0'
          Invoke-WebRequest -Uri $env:ZIG_X64_URL -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $env:ZIG_X64_SHA256) {
            throw 'Zig x64 archive checksum mismatch.'
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          $sdk >> $env:GITHUB_PATH
          "ZIG_GLOBAL_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'zig-cache')" >> $env:GITHUB_ENV
          & (Join-Path $sdk 'zig.exe') version

      - name: Fetch Zig dependencies
        shell: pwsh
        run: |
          # Zig 0.16.0 does not create this directory before fetching a zip.
          New-Item -ItemType Directory -Force (Join-Path $env:ZIG_GLOBAL_CACHE_DIR 'tmp') | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            zig build --fetch -Dtarget=${{ matrix.target }}
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Run required checks
        run: zig build ci -Dtarget=${{ matrix.target }}

      - name: Install Windows App Runtime 2.3.1
        shell: pwsh
        env:
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "WindowsAppRuntimeInstall-$env:RUNTIME_ARCH.exe"
          Invoke-WebRequest `
            -Uri "https://aka.ms/windowsappsdk/2.3/2.3.1/windowsappruntimeinstall-$env:RUNTIME_ARCH.exe" `
            -OutFile $installer
          & $installer --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Windows App Runtime installation failed with exit code $LASTEXITCODE."
          }

      - name: Build complete application
        run: zig build -Dtarget=${{ matrix.target }}
